<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blink Tax</title>
<style>
:root { --page: #17171c; --ink: #e9e6da; box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); color-scheme: dark; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page: #0d0d11; } }
:root[data-theme="dark"] { --page: #0d0d11; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
html, body { height: 100%; margin: 0; }
body { background: var(--page); display: flex; justify-content: center; overflow: hidden; font-family: Georgia, "Times New Roman", serif; -webkit-user-select: none; user-select: none; }
#wrap { position: relative; width: 100%; max-width: 480px; height: 100%; background: #000; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; }
#ui { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 28px; text-align: center; color: var(--ink); pointer-events: none; }
#ui h1 { margin: 0; font-size: 2.6rem; letter-spacing: 0.02em; }
#ui p { margin: 0; max-width: 26ch; font-size: 1.05rem; line-height: 1.35; }
#ui .small { font-size: 0.85rem; opacity: 0.7; }
#ui.gone { display: none; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="ui">
    <h1 id="t">Blink Tax</h1>
    <p id="m">Hold your thumb down to keep your eyes open. It backs away while you watch.</p>
    <p id="m2">Every blink costs you: it creeps closer while your eyes are closed. Survive until dawn.</p>
    <p class="small" id="m3">Loud sound. Touch to start.</p>
  </div>
</div>
<script>
(function () {
  var wrap = document.getElementById('wrap'), cv = document.getElementById('c'), ctx = cv.getContext('2d');
  var ui = document.getElementById('ui'), tEl = document.getElementById('t'), mEl = document.getElementById('m'), m2 = document.getElementById('m2'), m3 = document.getElementById('m3');
  var W = 0, H = 0, dpr = 1, mode = 'title', holding = false, ac = null;
  var MAX = 7, GOAL = 25, dist = 4, dry = 0, t = 0, forcedT = 0, scareT = 0, SCARE = 1.5, shake = 0, last = 0, beat = 0, flick = 0, nextFlick = 4, night = 1, bestNight = 0;
  try { bestNight = parseInt(localStorage.getItem('dontblink-night'), 10) || 0; } catch (e) {}

  function resize() { dpr = window.devicePixelRatio || 1; W = wrap.clientWidth; H = wrap.clientHeight; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  function sound() { try { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch (e) {} }
  function scream() {
    if (!ac) return;
    try {
      var n = ac.sampleRate * 0.7, b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0);
      for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
      var s = ac.createBufferSource(), g = ac.createGain(), o = ac.createOscillator(), g2 = ac.createGain();
      s.buffer = b; g.gain.value = 0.6; s.connect(g); g.connect(ac.destination); s.start();
      o.type = 'sawtooth'; o.frequency.setValueAtTime(90, ac.currentTime); o.frequency.exponentialRampToValueAtTime(40, ac.currentTime + 0.7);
      g2.gain.setValueAtTime(0.5, ac.currentTime); g2.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.7);
      o.connect(g2); g2.connect(ac.destination); o.start(); o.stop(ac.currentTime + 0.7);
    } catch (e) {}
  }
  function thump() {
    if (!ac) return;
    try {
      var o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(70, ac.currentTime); o.frequency.exponentialRampToValueAtTime(35, ac.currentTime + 0.15);
      g.gain.setValueAtTime(0.5, ac.currentTime); g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.18);
      o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + 0.2);
    } catch (e) {}
  }
  function start() { mode = 'play'; dist = 4; dry = 0; t = 0; forcedT = 0; beat = 0; flick = 0; nextFlick = 4; shake = 0; ui.className = 'gone'; }
  function lose() { mode = 'scare'; scareT = SCARE; shake = 1; scream(); }
  function over() {
    mode = 'over'; ui.className = ''; tEl.textContent = 'It got you';
    mEl.textContent = 'Night ' + night + '. You lasted ' + Math.floor(t) + ' of ' + GOAL + ' seconds.';
    m2.textContent = bestNight ? 'Best: survived ' + bestNight + (bestNight === 1 ? ' night.' : ' nights.') : 'You have not survived a night yet.';
    m3.textContent = 'Touch to try again.';
  }
  function win() {
    mode = 'win'; bestNight = Math.max(bestNight, night);
    try { localStorage.setItem('dontblink-night', String(bestNight)); } catch (e) {}
    ui.className = ''; tEl.textContent = 'Dawn'; mEl.textContent = 'You survived night ' + night + '.';
    m2.textContent = 'It will be faster next night.'; m3.textContent = 'Touch for night ' + (night + 1) + '.';
  }
  cv.addEventListener('pointerdown', function () {
    sound();
    if (mode === 'win') { night += 1; start(); holding = true; }
    else if (mode === 'title' || mode === 'over') { start(); holding = true; }
    else if (mode === 'play') holding = true;
  });
  function release() { holding = false; }
  cv.addEventListener('pointerup', release); cv.addEventListener('pointercancel', release);

  function eyesOpen() { return mode === 'play' && holding && forcedT <= 0; }

  function update(dt) {
    if (mode === 'scare') { scareT -= dt; shake = 0.4 + 0.6 * Math.random(); if (scareT <= 0) over(); return; }
    if (mode !== 'play') return;
    t += dt;
    var sp = 1 + 0.25 * (night - 1), r = Math.min(1, t / 20);
    var closedSpeed = (1.3 + 0.9 * r) * sp, dryTime = Math.max(0.7, (2.5 - 1.7 * r) / sp);
    var near = 1 - Math.max(dist, 0) / MAX;
    beat += dt; if (beat >= 1.1 - 0.8 * near) { beat = 0; thump(); }
    nextFlick -= dt; if (nextFlick <= 0) { flick = 0.25; nextFlick = 4 + Math.random() * 5; }
    if (flick > 0) flick -= dt;
    if (forcedT > 0) forcedT -= dt;
    if (eyesOpen()) {
      dry += dt / dryTime; dist = Math.min(MAX, dist + 0.8 * dt);
      if (dry >= 1) { forcedT = 1.1; dry = 1; }
    } else {
      dry = Math.max(0, dry - dt * 5);
      dist -= closedSpeed * (forcedT > 0 ? 1.3 : 1) * dt;
    }
    if (dist <= 0) { lose(); return; }
    if (t >= GOAL) win();
  }

  function creature(scale, jx, glow) {
    var cx = W / 2 + jx, by = H * 0.62, h = H * scale, w = h * 0.34, hy = by - h * 0.86;
    ctx.fillStyle = '#050507'; ctx.strokeStyle = '#050507';
    ctx.beginPath(); ctx.moveTo(cx - w * 0.45, by - h * 0.74); ctx.lineTo(cx + w * 0.45, by - h * 0.74); ctx.lineTo(cx + w * 0.7, by); ctx.lineTo(cx - w * 0.7, by); ctx.fill();
    ctx.lineWidth = Math.max(1, w * 0.09);
    ctx.beginPath(); ctx.moveTo(cx - w * 0.45, by - h * 0.7); ctx.lineTo(cx - w * 1.15, by - h * 0.15); ctx.moveTo(cx + w * 0.45, by - h * 0.7); ctx.lineTo(cx + w * 1.15, by - h * 0.15); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(cx, hy, w * 0.5, h * 0.15, 0, 0, 7); ctx.fill();
    var er = Math.max(2, h * 0.05), ex = w * 0.22;
    if (glow) { ctx.shadowColor = '#ff2a1a'; ctx.shadowBlur = er * 3; }
    ctx.fillStyle = glow ? '#ff4a3d' : '#f2efd8';
    ctx.beginPath(); ctx.ellipse(cx - ex, hy, er * 1.3, er, 0, 0, 7); ctx.ellipse(cx + ex, hy, er * 1.3, er, 0, 0, 7); ctx.fill();
    ctx.shadowBlur = 0; ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(cx - ex, hy, er * 0.25, 0, 7); ctx.arc(cx + ex, hy, er * 0.25, 0, 7); ctx.fill();
    if (scale > 0.4) {
      ctx.strokeStyle = '#ddd'; ctx.lineWidth = Math.max(1, h * 0.006); ctx.beginPath();
      for (var i = 0; i <= 8; i++) { var x = cx - w * 0.3 + (w * 0.6 / 8) * i, y = hy + h * 0.08 + (i % 2 ? h * 0.025 : 0); if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y); }
      ctx.stroke();
    }
  }

  function scareFace(p) {
    var k = Math.min(1, p * 3.5), i, a;
    ctx.fillStyle = (Math.floor(p * 40) % 2 && p < 0.6) ? '#5a0000' : '#000'; ctx.fillRect(-30, -30, W + 60, H + 60);
    ctx.fillStyle = '#08080b'; ctx.beginPath(); ctx.ellipse(W / 2, H * 0.5, W * (0.3 + 0.8 * k), H * (0.3 + 0.45 * k), 0, 0, 7); ctx.fill();
    var ey = H * (0.46 - 0.05 * k), ex = W * (0.14 + 0.12 * k), rx = W * (0.05 + 0.17 * k), ry = rx * 0.8;
    [W / 2 - ex, W / 2 + ex].forEach(function (cx) {
      ctx.shadowColor = '#ff1a10'; ctx.shadowBlur = 70 * k; ctx.fillStyle = '#f4efe0';
      ctx.beginPath(); ctx.ellipse(cx, ey, rx, ry, 0, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(190,0,0,0.85)'; ctx.lineWidth = Math.max(1, rx * 0.03);
      for (i = 0; i < 14; i++) { a = i * 0.9 + Math.sin(i * 7) * 0.3; ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * rx, ey + Math.sin(a) * ry); ctx.lineTo(cx + Math.cos(a) * rx * 0.45, ey + Math.sin(a) * ry * 0.45); ctx.stroke(); }
      ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(cx + (Math.random() - 0.5) * rx * 0.1, ey + (Math.random() - 0.5) * ry * 0.1, rx * 0.12, 0, 7); ctx.fill();
    });
    var my = H * 0.76, mw = W * (0.1 + 0.32 * k), mh = H * (0.03 + 0.13 * k);
    ctx.fillStyle = '#2a0000'; ctx.beginPath(); ctx.ellipse(W / 2, my, mw, mh, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#e8e4d4';
    for (i = 0; i < 10; i++) { var tx = W / 2 - mw + (mw * 2 / 9) * i, tl = mh * (0.5 + 0.3 * ((i * 37) % 5) / 5);
      ctx.beginPath(); ctx.moveTo(tx - mw * 0.09, my - mh * 0.75); ctx.lineTo(tx + mw * 0.09, my - mh * 0.75); ctx.lineTo(tx, my - mh * 0.75 + tl); ctx.fill();
      ctx.beginPath(); ctx.moveTo(tx - mw * 0.09, my + mh * 0.75); ctx.lineTo(tx + mw * 0.09, my + mh * 0.75); ctx.lineTo(tx, my + mh * 0.75 - tl); ctx.fill(); }
  }

  function draw(now) {
    ctx.save();
    if (shake > 0.02) ctx.translate((Math.random() - 0.5) * 36 * shake, (Math.random() - 0.5) * 36 * shake);
    ctx.fillStyle = '#000'; ctx.fillRect(-40, -40, W + 80, H + 80);
    var near = 1 - Math.max(dist, 0) / MAX, vx = W / 2, vy = H * 0.45;
    if (mode === 'scare') scareFace(1 - scareT / SCARE);
    else if (mode === 'win') { var wg = ctx.createLinearGradient(0, 0, 0, H); wg.addColorStop(0, '#10121f'); wg.addColorStop(1, '#7a4a2a'); ctx.fillStyle = wg; ctx.fillRect(0, 0, W, H); }
    else if (mode === 'play' && !eyesOpen()) { ctx.fillStyle = 'rgba(120,0,0,' + (0.15 + 0.5 * near + (forcedT > 0 ? 0.15 : 0)) + ')'; ctx.fillRect(0, 0, W, H); }
    else {
      var g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#15161c'); g.addColorStop(1, '#0a0a0e'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = '#2a2c36'; ctx.lineWidth = 2;
      [[0, 0], [W, 0], [0, H], [W, H], [W * 0.5, 0], [W * 0.5, H]].forEach(function (p) { ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.lineTo(vx + (p[0] - vx) * 0.08, vy + (p[1] - vy) * 0.08); ctx.stroke(); });
      ctx.strokeStyle = '#1d1f27';
      for (var i = 1; i < 6; i++) { var k = 0.08 + i * 0.15; ctx.strokeRect(vx - W * k * 0.5, vy - H * k * 0.4, W * k, H * k * 0.8); }
      if (mode === 'play') {
        if (flick > 0 && Math.random() < 0.5) { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); }
        var nf = Math.min(1, near + (flick > 0 ? 0.3 : 0));
        creature(0.1 + 0.75 * Math.pow(nf, 1.6), Math.sin(now / 120) * near * 1.5, near > 0.6);
      }
    }
    ctx.restore();
    if (mode === 'play') {
      var d = Math.min(1, dry), v = 0.15 + 0.8 * d * d, rg = ctx.createRadialGradient(W / 2, H * 0.5, H * 0.15, W / 2, H * 0.5, H * 0.75);
      rg.addColorStop(0, 'rgba(0,0,0,0)'); rg.addColorStop(1, 'rgba(0,0,0,' + Math.min(1, v + 0.3) + ')'); ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#2a2a30'; ctx.fillRect(W * 0.2, 14, W * 0.6, 4); ctx.fillStyle = '#c8332b'; ctx.fillRect(W * 0.2, 14, W * 0.6 * d, 4);
      ctx.fillStyle = '#e9e6da'; ctx.font = '20px Georgia, serif'; ctx.textAlign = 'center';
      ctx.fillText('Night ' + night + '   ' + Math.floor(t) + ' / ' + GOAL, W / 2, 46);
      var pr = forcedT > 0 ? 'TOO LATE' : (!holding ? 'HOLD' : (dry > 0.75 ? 'BLINK!' : ''));
      if (pr) { ctx.font = 'bold 34px Georgia, serif'; ctx.fillStyle = (pr === 'HOLD') ? '#e9e6da' : '#ff4a3d'; ctx.fillText(pr, W / 2, H * 0.9); }
    }
  }
  function frame(ts) { var dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts; update(dt); draw(ts); requestAnimationFrame(frame); }
  if (window.ResizeObserver) new ResizeObserver(resize).observe(wrap);
  window.addEventListener('resize', resize); resize(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
